
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prishma Mart - Cart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8fb;
        }

        header {
            background: #f3d6e4;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #6d3650;
            margin: 0;
        }

        .cart-container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #5d3445;
        }

        .item-price {
            color: #c45b86;
            font-weight: bold;
            margin-top: 8px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .total {
            background: #f3d6e4;
            padding: 20px;
            border-radius: 15px;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #6d3650;
            margin: 20px 0;
        }

        .btn {
            background: #c45b86;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .remove-btn {
            background: #dc3545;
        }

        .checkout-btn {
            display: block;
            margin-left: auto;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            color: #6d3650;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 My Cart</h1>
</header>

<div class="cart-container" id="cartContainer"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartContainer = document.getElementById("cartContainer");

function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function renderCart() {
    cartContainer.innerHTML = "";

    if (cart.length === 0) {
        cartContainer.innerHTML = `
            <h2 class="empty">Your cart is empty 🛒</h2>
            <p class="empty">
                <a href="home.html">Continue Shopping</a>
            </p>
        `;
        return;
    }

    let total = 0;

    cart.forEach(function(item, index) {
        const price = Number(item.price) || 0;
        const quantity = Math.max(1, Number(item.quantity) || 1);
        total += price * quantity;

        const itemElement = document.createElement("div");
        itemElement.className = "cart-item";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name || "Product";

        const priceText = document.createElement("div");
        priceText.className = "item-price";
        priceText.textContent =
            "₹" + price.toLocaleString("en-IN") + " each";

        details.append(name, priceText);

        const quantityControls = document.createElement("div");
        quantityControls.className = "quantity-controls";

        const minusButton = document.createElement("button");
        minusButton.className = "btn";
        minusButton.textContent = "−";
        minusButton.disabled = quantity <= 1;
        minusButton.onclick = function() {
            updateQuantity(index, -1);
        };

        const quantityText = document.createElement("span");
        quantityText.className = "quantity";
        quantityText.textContent = quantity;

        const plusButton = document.createElement("button");
        plusButton.className = "btn";
        plusButton.textContent = "+";
        plusButton.onclick = function() {
            updateQuantity(index, 1);
        };

        quantityControls.append(
            minusButton,
            quantityText,
            plusButton
        );

        const removeButton = document.createElement("button");
        removeButton.className = "btn remove-btn";
        removeButton.textContent = "Remove";
        removeButton.onclick = function() {
            removeItem(index);
        };

        itemElement.append(
            details,
            quantityControls,
            removeButton
        );

        cartContainer.appendChild(itemElement);
    });

    const totalElement = document.createElement("div");
    totalElement.className = "total";
    totalElement.textContent =
        "Total: ₹" + total.toLocaleString("en-IN");

    cartContainer.appendChild(totalElement);

    const checkoutButton = document.createElement("button");
    checkoutButton.className = "btn checkout-btn";
    checkoutButton.textContent = "🛍️ Proceed to Checkout";
    checkoutButton.onclick = checkout;

    cartContainer.appendChild(checkoutButton);
}

function updateQuantity(index, change) {
    const currentQuantity = Math.max(
        1,
        Number(cart[index].quantity) || 1
    );

    cart[index].quantity = currentQuantity + change;

    if (cart[index].quantity < 1) {
        cart[index].quantity = 1;
    }

    saveCart();
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
    renderCart();
}

function checkout() {
    window.location.href = "checkout.html";
}

renderCart();
</script>

</body>
</html>
