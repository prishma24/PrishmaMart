<!DOCTYPE html>
<html>
<head>
    <title>Prishma Mart - Cart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8fb;
        }

        header {
            background: #f3d6e4;
            padding: 20px 40px;
            text-align: center;
        }

        header h1 {
            color: #6d3650;
            margin: 0;
        }

        .cart-container {
            width: 80%;
            margin: 40px auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #5d3445;
        }

        .item-price {
            color: #c45b86;
            font-weight: bold;
        }

        .total {
            background: #f3d6e4;
            padding: 20px;
            border-radius: 15px;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #6d3650;
        }

        .btn {
            background: #c45b86;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 My Cart</h1>
</header>

<div class="cart-container" id="cartContainer"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartContainer = document.getElementById("cartContainer");

if (cart.length === 0) {
    cartContainer.innerHTML = "<h2 style='text-align:center; color:#6d3650;'>Your cart is empty 🛒</h2>";
} else {

    let total = 0;

    cart.forEach(function(item, index) {

        total = total + item.price;

        cartContainer.innerHTML += `
            <div class="cart-item">
                <div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">₹${item.price}</div>
                </div>

                <button class="btn" onclick="removeItem(${index})">
                    Remove
                </button>
            </div>
        `;
    });

    cartContainer.innerHTML += `
       
    <div class="total">
        Total: ₹${total}
    </div>

    <button class="btn" onclick="checkout()">
        🛍️ Proceed to Checkout
    </button>
`;
    
}

function removeItem(index) {
    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload();
}
function checkout() {
    window.location.href = "checkout.html";
}
</script>

</body>
</html>
