
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prishma Mart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8fb;
            color: #5d3445;
        }

        header {
            background: #f3d6e4;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #6d3650;
            margin: 0;
        }

        .checkout-box {
            width: 450px;
            max-width: 92%;
            margin: 35px auto;
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #6d3650;
        }

        .order-summary {
            background: #fff2f7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0;
        }

        .total {
            border-top: 1px solid #e0b8c9;
            padding-top: 12px;
            font-weight: bold;
            font-size: 19px;
            color: #a8446d;
        }

        label {
            display: block;
            margin-top: 14px;
            color: #5d3445;
            font-weight: bold;
        }

        input, textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #e0b8c9;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            height: 85px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            background: #c45b86;
            color: white;
            border: none;
            padding: 13px;
            margin-top: 20px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #a8446d;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            overflow-wrap: anywhere;
        }

        .error {
            display: block;
            background: #ffe8e8;
            color: #a00000;
        }

        .success {
            display: block;
            background: #e6ffed;
            color: #176b35;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #a8446d;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ Prishma Mart</h1>
</header>

<div class="checkout-box">
    <h2>Checkout 💕</h2>

    <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="summaryItems"></div>
        <div class="summary-row total">
            <span>Total Amount</span>
            <span id="totalAmount">₹0</span>
        </div>
    </div>

    <form id="checkoutForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required maxlength="100">

        <label for="email">Email</label>
        <input type="email" id="email" required maxlength="150">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required maxlength="20">

        <label for="address">Delivery Address</label>
        <textarea id="address" required maxlength="500"></textarea>

        <button class="btn" id="placeOrderButton" type="submit">
            Confirm Order 🛍️
        </button>
    </form>

    <div id="message" class="message" role="status"></div>

    <a class="back-link" href="cart.html">← Back to Cart</a>
</div>

<script>
    const API_URL = "http://localhost:8080/orders";

    const checkoutForm = document.getElementById("checkoutForm");
    const summaryItems = document.getElementById("summaryItems");
    const totalAmount = document.getElementById("totalAmount");
    const message = document.getElementById("message");
    const placeOrderButton = document.getElementById("placeOrderButton");

    function getCart() {
        try {
            const savedCart = JSON.parse(localStorage.getItem("cart") || "[]");
            return Array.isArray(savedCart) ? savedCart : [];
        } catch (error) {
            return [];
        }
    }

    function getItemQuantity(item) {
        return Math.max(1, Number(item.quantity) || 1);
    }

    function getItemPrice(item) {
        return Number(item.price) || 0;
    }

    function calculateTotal(cart) {
        return cart.reduce(function(sum, item) {
            return sum + getItemPrice(item) * getItemQuantity(item);
        }, 0);
    }

    function formatPrice(price) {
        return "₹" + price.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });
    }

    function renderSummary() {
        const cart = getCart();
        summaryItems.replaceChildren();

        if (cart.length === 0) {
            const emptyText = document.createElement("p");
            emptyText.textContent = "Your cart is empty. Please add products first.";
            summaryItems.appendChild(emptyText);

            totalAmount.textContent = formatPrice(0);
            placeOrderButton.disabled = true;
            return;
        }

        cart.forEach(function(item) {
            const row = document.createElement("div");
            row.className = "summary-row";

            const productName = document.createElement("span");
            productName.textContent =
                (item.name || "Product") + " × " + getItemQuantity(item);

            const productPrice = document.createElement("span");
            productPrice.textContent = formatPrice(
                getItemPrice(item) * getItemQuantity(item)
            );

            row.append(productName, productPrice);
            summaryItems.appendChild(row);
        });

        totalAmount.textContent = formatPrice(calculateTotal(cart));
        placeOrderButton.disabled = false;
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    checkoutForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const cart = getCart();

        if (cart.length === 0) {
            showMessage("Your cart is empty. Please add a product first.", "error");
            return;
        }

        const total = calculateTotal(cart);

        if (!Number.isFinite(total) || total <= 0) {
            showMessage("The order total is invalid. Please check your cart.", "error");
            return;
        }

        const order = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: document.getElementById("address").value.trim(),
            total: total
        };

        if (!order.name || !order.email || !order.phone || !order.address) {
            showMessage("Please fill in all the required details.", "error");
            return;
        }

        placeOrderButton.disabled = true;
        placeOrderButton.textContent = "Placing Order...";
        message.className = "message";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(order)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                    "Server returned HTTP " + response.status +
                    (errorText ? ": " + errorText.slice(0, 250) : "")
                );
            }

            let savedOrder = null;

            try {
                savedOrder = await response.json();
            } catch (error) {
                // Some APIs may return an empty success response.
            }

            localStorage.removeItem("cart");
            checkoutForm.reset();

            const orderId = savedOrder && savedOrder.id
                ? " Order ID: " + savedOrder.id
                : "";

            showMessage(
                "🎉 Order placed successfully!" + orderId,
                "success"
            );

            renderSummary();
            placeOrderButton.textContent = "Order Placed";

        } catch (error) {
            console.error("Checkout error:", error);

            showMessage(
                "Order failed: " + error.message +
                ". Check that the backend is running and the frontend is opened using Live Server.",
                "error"
            );

            placeOrderButton.disabled = false;
            placeOrderButton.textContent = "Try Again";
        }
    });

    renderSummary();
</script>

</body>
</html>
