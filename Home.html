
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prishma Mart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8fb;
        }

        header {
            background: #f3d6e4;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #6d3650;
        }

        .welcome {
            color: #6d3650;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 35px 20px;
        }

        .hero h1 {
            color: #6d3650;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #777;
            font-size: 17px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px 30px 50px;
        }

        .card {
            background: white;
            width: 230px;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
        }

        .product-img {
            width: 100%;
            height: 180px;
            background: #f8e8ef;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h3 {
            color: #5d3445;
            margin-bottom: 8px;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }

        .price {
            font-weight: bold;
            color: #c45b86;
            font-size: 19px;
            margin: 10px 0;
        }

        .rating {
            color: #e6a400;
            margin: 8px;
        }

        .btn {
            background: #c45b86;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
        }

        .btn:hover {
            background: #a8446d;
        }

        .wishlist-btn {
            background: white;
            color: #c45b86;
            border: 1px solid #e0b8c9;
            padding: 9px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
        }

        .wishlist-btn:hover {
            background: #f8e8ef;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            width: 300px;
            max-width: 75%;
            padding: 12px 18px;
            border: 1px solid #e0b8c9;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 20px 25px;
            flex-wrap: wrap;
        }

        .categories button {
            background: white;
            color: #6d3650;
            border: 1px solid #e0b8c9;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .categories button:hover {
            background: #f3d6e4;
        }

        #message {
            text-align: center;
            color: #6d3650;
            padding: 10px;
        }

        footer {
            background: #f3d6e4;
            color: #6d3650;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px;
                justify-content: center;
                text-align: center;
            }

            .hero h1 {
                font-size: 30px;
            }

            .products {
                padding: 15px;
            }

            .card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">♡ Prishma Mart</div>
    <div class="welcome">Welcome to Prishma Mart 🛍️</div>
</header>

<div style="text-align:center; margin:20px;">
    <button class="btn" onclick="viewCart()">🛒 View Cart</button>
    <button class="btn" onclick="window.location.href='wishlist.html'">
        ❤️ Wishlist
    </button>
    <button class="btn" onclick="window.location.href='orders.html'">
        📦 My Orders
    </button>
</div>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search products..."
        oninput="searchProducts()"
    >
    <button class="btn" onclick="searchProducts()">Search</button>
</div>

<div class="categories">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('bag')">Bags</button>
    <button onclick="filterProducts('dress')">Dresses</button>
    <button onclick="filterProducts('shoe')">Shoes</button>
    <button onclick="filterProducts('watch')">Watches</button>
    <button onclick="filterProducts('clothing')">Clothing</button>
    <button onclick="filterProducts('accessories')">Accessories</button>
</div>

<section class="hero">
    <h1>Shop Your Favorites ✨</h1>
    <p>Everything you love, all in one place.</p>
</section>

<p id="message">Loading products...</p>

<section class="products" id="productsContainer"></section>

<footer>
    <p>© 2026 Prishma Mart | Happy Shopping! ♡</p>
</footer>

<script>

        }
    ];

    let allProducts = [];
    let activeCategory = "all";

    function createProductCard(product) {
        const card = document.createElement("div");
        card.className = "card";

        if (product.id !== undefined && product.id !== null) {
            card.dataset.backendProductId = product.id;
        }

        card.dataset.category = product.category || "general";

        const imageBox = document.createElement("div");
        imageBox.className = "product-img";

        if (product.image) {
            const image = document.createElement("img");
            image.src = product.image;
            image.alt = product.name || "Product";
            image.loading = "lazy";
            image.onerror = function() {
                imageBox.textContent = "🛍️";
            };
            imageBox.appendChild(image);
        } else {
            imageBox.textContent = "🛍️";
        }

        const name = document.createElement("h3");
        name.textContent = product.name || "Unnamed Product";

        const description = document.createElement("p");
        description.textContent =
            product.description || "No description available";

        const rating = document.createElement("div");
        rating.className = "rating";
        rating.textContent = "★★★★★";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent =
            "₹" + Number(product.price || 0).toLocaleString("en-IN");

        const stock = document.createElement("p");
        stock.innerHTML = "<b>Available:</b> " +
            (product.stock !== undefined
                ? Number(product.stock)
                : "In Stock");

        const cartButton = document.createElement("button");
        cartButton.className = "btn";
        cartButton.textContent = "Add to Cart";
        cartButton.addEventListener("click", function() {
            addToCart(product.name, Number(product.price || 0));
        });

        const wishlistButton = document.createElement("button");
        wishlistButton.className = "wishlist-btn";
        wishlistButton.textContent = "♡ Wishlist";
        wishlistButton.addEventListener("click", function() {
            toggleWishlist(product.name, Number(product.price || 0));
        });

        card.append(
            imageBox,
            name,
            description,
            rating,
            price,
            stock,
            cartButton,
            document.createElement("br"),
            wishlistButton
        );
    
if (product.id !== undefined && product.id !== null) {
    const deleteButton = document.createElement("button");

    deleteButton.textContent = "Delete Product";
    deleteButton.style.background = "#dc3545";
    deleteButton.style.color = "white";
    deleteButton.style.padding = "10px";
    deleteButton.style.marginTop = "8px";
    deleteButton.style.border = "none";
    deleteButton.style.borderRadius = "6px";
    deleteButton.style.cursor = "pointer";

    deleteButton.addEventListener("click", async function () {
        const confirmed = confirm(
            "Are you sure you want to delete " + product.name + "?"
        );

        if (!confirmed) return;

        try {
            const response = await fetch(
                "http://localhost:8080/products/" + product.id,
                { method: "DELETE" }
            );

            if (!response.ok) {
                throw new Error("Delete failed");
            }

            allProducts = allProducts.filter(function (item) {
                return String(item.id) !== String(product.id);
            });

            displayProducts(allProducts);
            alert("Product deleted successfully!");

        } catch (error) {
            console.error(error);
            alert("Delete failed. Please check whether the backend is running.");
        }
    });

    card.appendChild(deleteButton);
}
        return card;
    }

    function displayProducts(products) {
        const container = document.getElementById("productsContainer");
        container.innerHTML = "";

        products.forEach(function(product) {
            container.appendChild(createProductCard(product));
        });

        applyProductFilters();
    }

    async function loadProducts() {
        const message = document.getElementById("message");

        // Display the 20 built-in products first.
        allProducts = [...localProducts];
        displayProducts(allProducts);
        message.textContent = "";

        // Then load products added by the Seller from Spring Boot.
        try {
            const response = await fetch("http://localhost:8080/products");

            if (!response.ok) {
                throw new Error("Server returned status " + response.status);
            }

            const backendProducts = await response.json();

            // Avoid duplicates if a product was already loaded.
            const existingIds = new Set(
                allProducts
                    .filter(product => product.id !== undefined)
                    .map(product => String(product.id))
            );

            backendProducts.forEach(function(product) {
                if (product.id === undefined ||
                    !existingIds.has(String(product.id))) {
                    allProducts.push(product);

                    if (product.id !== undefined) {
                        existingIds.add(String(product.id));
                    }
                }
            });

            displayProducts(allProducts);
            message.textContent = "";

        } catch (error) {
            console.error("Product loading error:", error);
            message.textContent =
                "Showing available products. Seller products need the backend running.";
        }
    }

    function addToCart(productName, price) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        cart.push({
            name: productName,
            price: price
        });

        localStorage.setItem("cart", JSON.stringify(cart));

        alert(productName + " added to cart! 🛒");
    }

    function viewCart() {
        window.location.href = "cart.html";
    }

    function toggleWishlist(name, price) {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

        const existing = wishlist.find(function(item) {
            return item.name === name;
        });

        if (existing) {
            wishlist = wishlist.filter(function(item) {
                return item.name !== name;
            });
            alert("Removed from wishlist ❤️");
        } else {
            wishlist.push({
                name: name,
                price: price
            });
            alert("Added to wishlist ❤️");
        }

        localStorage.setItem("wishlist", JSON.stringify(wishlist));
    }

    function searchProducts() {
        applyProductFilters();
    }

    function filterProducts(category) {
        activeCategory = category;
        applyProductFilters();
    }

    function applyProductFilters() {
        const searchText = document
            .getElementById("searchInput")
            .value.toLowerCase()
            .trim();

        const cards = document.querySelectorAll("#productsContainer .card");

        cards.forEach(function(card) {
            const text = card.innerText.toLowerCase();
            const category = (card.dataset.category || "").toLowerCase();

            const matchesSearch =
                searchText === "" || text.includes(searchText);

            let matchesCategory = activeCategory === "all";

            if (!matchesCategory) {
                if (activeCategory === "shoe") {
                    matchesCategory =
                        category.includes("shoe") ||
                        text.includes("sneaker");
                } else if (activeCategory === "bag") {
                    matchesCategory =
                        category.includes("bag") ||
                        text.includes("bag") ||
                        text.includes("backpack");
                } else if (activeCategory === "dress") {
                    matchesCategory =
                        category.includes("dress") ||
                        text.includes("dress");
                } else if (activeCategory === "watch") {
                    matchesCategory =
                        category.includes("watch") ||
                        text.includes("watch");
                } else if (activeCategory === "clothing") {
                    matchesCategory =
                        category.includes("clothing") ||
                        text.includes("jeans") ||
                        text.includes("kurti") ||
                        text.includes("t-shirt") ||
                        text.includes("top");
                } else if (activeCategory === "accessories") {
                    matchesCategory =
                        category.includes("accessories") ||
                        text.includes("sunglasses") ||
                        text.includes("necklace") ||
                        text.includes("wallet");
                }
            }

            card.style.display =
                matchesSearch && matchesCategory ? "" : "none";
        });
    }

    loadProducts();
</script>
